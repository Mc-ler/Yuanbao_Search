<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>万物皆可查 · Confirming Everything</title>
  <link rel="stylesheet" href="/static/styles.css?v=4.4">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="aurora-blob blob-a"></span><span class="aurora-blob blob-b"></span><span class="aurora-blob blob-c"></span><span class="aurora-blob blob-d"></span><span class="aurora-blob blob-e"></span></div>
  <header class="app-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="万物皆可查 · Confirming Everything">
        <span class="brand-logo" aria-hidden="true">
          <img class="logo-light" src="/static/assets/team-logo2-light.png" alt="GOLDEN-US">
          <img class="logo-dark" src="/static/assets/team-logo2-dark.png" alt="">
        </span>
        <span class="brand-copy"><strong data-i18n="brand.name">万物皆可查</strong><small data-i18n="brand.sub">Confirming Everything</small></span>
      </a>
      <div class="header-actions">
        <button id="llmStatus" class="status-chip warn" type="button" data-i18n-title="status.llmTitle">
          <span class="dot"></span><span data-i18n="status.llm">LLM</span><b id="llmStatusText">检查中</b>
        </button>
        <button id="searchStatus" class="status-chip warn" type="button" data-i18n-title="status.searchTitle">
          <span class="dot"></span><span data-i18n="status.search">搜索</span><b id="searchStatusText">检查中</b>
        </button>
        <label class="switch" data-i18n-title="status.screenshotTitle">
          <input id="screenshotToggle" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
          <span id="screenshotLabel" data-i18n="status.screenshot">截图</span>
        </label>
        <button id="themeToggle" class="icon-btn" type="button" data-i18n-title="status.theme">◐</button>
        <button id="langToggle" class="icon-btn" type="button" data-i18n-title="status.lang">EN</button>
      </div>
    </div>
  </header>

  <main class="shell main">
    <section class="hero">
        <h1 data-i18n="hero.title">今天想查什么？</h1>

      <div class="mode-switch" role="tablist" aria-label="Mode">
        <button id="modeResearch" class="mode-btn active" data-mode="research" type="button" role="tab" aria-selected="true">
          <strong data-i18n="mode.research">深度研究</strong>
        </button>
        <button id="modeVerify" class="mode-btn" data-mode="verify" type="button" role="tab" aria-selected="false">
          <strong data-i18n="mode.verify">一句话查证</strong>
        </button>
      </div>

      <div class="composer">
        <label class="sr-only" for="queryInput" data-i18n="input.label">输入</label>
        <textarea id="queryInput" rows="1" data-i18n-placeholder="input.placeholderResearch" placeholder="输入一个想深度调查的问题…"></textarea>
        <div class="composer-actions">
          <button id="runBtn" class="btn btn-primary" type="button" data-i18n="action.runResearch">开始研究</button>
          <button id="clearBtn" class="btn btn-quiet" type="button" data-i18n="action.clear">清空</button>
          <span id="runState" class="state-pill" data-i18n="state.ready">就绪</span>
        </div>
      </div>

      <div id="setupCallout" class="setup-callout" hidden>
        <span id="setupText" data-i18n="setup.llmMissing">LLM 未配置：请填写 API Key、Base URL 与模型。</span>
        <button id="setupLlmBtn" class="btn btn-small" type="button" data-i18n="action.configure">配置</button>
      </div>
    </section>

    <section class="workspace">
      <section class="panel log-panel">
        <div class="panel-head">
          <h2 data-i18n="log.title">执行日志</h2>
          <button id="clearLogBtn" class="btn btn-small btn-quiet" type="button" data-i18n="action.clearLog">清空日志</button>
        </div>
        <p id="logMeta" class="panel-meta" data-i18n="log.emptyMeta">运行后在这里保留每一步</p>
        <ol id="logList" class="log-list"></ol>
      </section>

      <section class="panel report-panel">
        <div class="panel-head">
          <h2 data-i18n="report.title">最终报告</h2>
          <button id="printBtn" class="btn btn-small btn-quiet" type="button" data-i18n="action.print">打印</button>
        </div>
        <div id="reportBox" class="report-box">
          <div class="empty-state">
            <strong data-i18n="report.emptyTitle">还没有报告</strong>
            <p data-i18n="report.emptyText">选择模式、输入问题并运行；日志和报告会分别保留。</p>
          </div>
        </div>
      </section>
    </section>

    <footer class="footer">
      <p data-i18n="footer.disclaimer">只核对公开信息与来源，不评价个人，不构成消费或法律建议。</p>
    </footer>
  </main>

  <dialog id="llmDialog" class="modal" aria-labelledby="llmDialogTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="llmDialogTitle" data-i18n="config.llmTitle">LLM 配置</h2>
        <button id="closeLlm" class="icon-btn" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="section-title"><span id="llmConfigStatus" class="config-status warn">未配置</span></div>
        <label class="field"><span data-i18n="config.provider">Provider</span>
          <select id="llmProvider">
            <option value="deepseek">DeepSeek</option>
            <option value="gpt">GPT (Toklens)</option>
            <option value="codex">Codex (Toklens)</option>
          </select>
        </label>
        <label class="field"><span data-i18n="config.apiKey">API Key</span>
          <input id="llmKey" type="password" autocomplete="off" placeholder="sk-...">
        </label>
        <label class="field"><span data-i18n="config.baseUrl">Base URL</span>
          <input id="llmBase" type="url" placeholder="https://api.deepseek.com/v1">
        </label>
        <label class="field"><span data-i18n="config.model">Model</span>
          <input id="llmModel" type="text" placeholder="deepseek-flash">
        </label>
        <div class="config-actions">
          <button id="saveLlm" class="btn btn-small btn-primary" type="button" data-i18n="action.save">保存</button>
          <span id="llmSaveState" class="config-hint"></span>
        </div>
        <p class="config-hint" data-i18n="config.llmHint">Key 只写入本地 .env；保存后立即重建 LLM 客户端，不写入前端存储。</p>
      </div>
    </div>
  </dialog>

  <dialog id="searchDialog" class="modal" aria-labelledby="searchDialogTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="searchDialogTitle" data-i18n="config.searchTitle">元宝搜索</h2>
        <button id="closeSearch" class="icon-btn" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="section-title"><span id="searchConfigStatus" class="config-status warn">未配置</span></div>
        <label class="field"><span data-i18n="config.apiKey">API Key</span>
          <input id="searchKey" type="password" autocomplete="off" placeholder="SearchPro key">
        </label>
        <label class="field"><span data-i18n="config.baseUrl">Base URL</span>
          <input id="searchBase" type="url" placeholder="https://api.wsa.cloud.tencent.com">
        </label>
        <div class="config-actions">
          <button id="saveSearch" class="btn btn-small btn-primary" type="button" data-i18n="action.save">保存</button>
          <span id="searchSaveState" class="config-hint"></span>
        </div>
        <p class="config-hint" data-i18n="config.searchHint">用于元宝 SearchPro；保存后立即重建检索客户端。</p>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js?v=4.4"></script>
</body>
</html>
