<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>说法鉴定所 · Research Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="说法鉴定所首页">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><strong>说法鉴定所</strong><small>Research Agent</small></span>
    </a>
    <span id="modeBadge" class="badge muted">连接中</span>
  </header>

  <main class="page">
    <div id="notice" class="notice" hidden></div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="research" type="button">研究</button>
      <button class="tab" data-tab="report" type="button">调查报告</button>
    </nav>

    <section id="tab-research" class="tab-panel">
      <div class="composer">
        <label class="field-label" for="textInput">研究问题</label>
        <textarea id="textInput" rows="3" placeholder="输入一个具体问题，例如：2024年全国居民人均可支配收入41314元的数据来源和统计口径是什么？"></textarea>
        <div class="actions">
          <button id="runBtn" class="btn btn-primary" type="button">开始检索</button>
          <button id="planBtn" class="btn" type="button">生成查询计划</button>
          <button id="clearBtn" class="btn btn-quiet" type="button">清空</button>
        </div>
      </div>

      <section id="planPanel" class="card panel" hidden>
        <div class="panel-head"><div><h2>查询计划</h2><p id="planSub" class="muted"></p></div><span id="planState" class="state">准备中</span></div>
        <p id="planSummary" class="summary"></p>
        <div class="panel-grid">
          <div><h3>初始查询</h3><div id="planQueries" class="query-list"></div></div>
          <div><h3>B/C 回退 · 再查询</h3><div id="planFallbacks" class="query-list"></div></div>
        </div>
      </section>

      <section id="researchPanel" class="card panel" hidden>
        <div class="panel-head"><div><h2 id="researchTitle">检索结果</h2><p id="researchSub" class="muted"></p></div><span id="researchState" class="state">准备中</span></div>
        <div id="answer" class="answer"></div>
        <div id="metrics" class="metrics"></div>
        <div id="results" class="results"></div>
      </section>
    </section>

    <section id="tab-report" class="tab-panel" hidden>
      <div class="panel-head"><h2>调查报告</h2><button id="reportPrint" class="btn btn-quiet" type="button">打印</button></div>
      <div id="reportBox" class="report-box"><p class="muted">尚未生成调查报告。请先在「研究」页运行一次检索。</p></div>
    </section>

    <footer class="footer">
      <p>只核对公开信息与来源，不评价个人，不构成消费或法律建议。</p>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
